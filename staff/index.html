<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eth Sànglier Staff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#27396D">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sànglier Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>

/* Layout: glove-first piste tool. Navy brand bar with the boar, every target >= 60px, piste colours carry level meaning, red = the one action that matters */
:root{
  --navy:#27396D; --navy-2:#1D2C57; --on-navy:#FFFFFF; --on-navy-dim:#B9C4E0;
  --bg:#EDF1F6; --surface:#FFFFFF; --sunk:#E3E9F1; --ink:#111A2C; --muted:#56637A; --line:#CDD6E3;
  --accent:#B4232E; --accent-ink:#FFFFFF;
  --ok:#1D7447; --ok-bg:#DFF1E6; --warn:#8F5404; --warn-bg:#FAEED6; --bad:#B4232E; --bad-bg:#FBE3E4;
  --lv-verde:#2E7D32; --lv-azul:#1E5BB8; --lv-roja:#C62828; --lv-negra:#161616;
  --gold:#9C720C; --silver:#66727E; --bronze:#935529;
  --tap:60px; --tap-lg:76px;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#1E2D58; --navy-2:#16224A; --on-navy:#FFFFFF; --on-navy-dim:#AEB9D6;
  --bg:#0A1020; --surface:#131C30; --sunk:#1B2740; --ink:#E7ECF5; --muted:#9AA6BC; --line:#2A3753;
  --accent:#E0505B; --accent-ink:#FFFFFF;
  --ok:#5CC48C; --ok-bg:#132B1E; --warn:#E3A84A; --warn-bg:#2F240E; --bad:#F07A82; --bad-bg:#371A1E;
  --lv-verde:#3E9B43; --lv-azul:#3B7BE0; --lv-roja:#DE3B3B; --lv-negra:#000000;
  --gold:#D9AA3A; --silver:#A9B5BF; --bronze:#C98552; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#1E2D58; --navy-2:#16224A; --on-navy:#FFFFFF; --on-navy-dim:#AEB9D6;
  --bg:#0A1020; --surface:#131C30; --sunk:#1B2740; --ink:#E7ECF5; --muted:#9AA6BC; --line:#2A3753;
  --accent:#E0505B; --accent-ink:#FFFFFF;
  --ok:#5CC48C; --ok-bg:#132B1E; --warn:#E3A84A; --warn-bg:#2F240E; --bad:#F07A82; --bad-bg:#371A1E;
  --lv-verde:#3E9B43; --lv-azul:#3B7BE0; --lv-roja:#DE3B3B; --lv-negra:#000000;
  --gold:#D9AA3A; --silver:#A9B5BF; --bronze:#C98552; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn{cursor:pointer;touch-action:manipulation;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.9rem}
.wrap{max-width:1120px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.wrap.has-nav{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* buttons: sized for gloves */
.btn{min-height:var(--tap);padding:0 22px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);text-align:center;line-height:1.15}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.huge{min-height:var(--tap-lg);font-size:1.3rem;font-family:var(--f-display);letter-spacing:.03em;border-radius:18px;width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:48px;padding:0 14px;font-size:.95rem;border-radius:12px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.btn.rec{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 25%,transparent)}}}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:26px;height:26px;flex:none}

/* brand bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
.top-in{max-width:1120px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top-logo{height:44px;width:auto;display:block}
.top .who{display:flex;align-items:center;gap:10px;min-width:0;margin-left:auto}
.top .who b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who small{display:block;color:var(--on-navy-dim);font-size:.8rem;line-height:1}
.top .btn{background:transparent;border-color:color-mix(in srgb,var(--on-navy) 35%,transparent);color:var(--on-navy)}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.tab{border:0;background:none;min-height:52px;padding:0 11px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.03em;color:var(--on-navy-dim);border-bottom:4px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--on-navy);border-bottom-color:var(--accent)}

/* instructor bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{min-height:80px;border:0;background:none;color:var(--on-navy-dim);display:grid;place-items:center;align-content:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:.04em;border-top:5px solid transparent}
.bnav button svg{width:30px;height:30px}
.bnav button[aria-current="page"]{color:var(--on-navy);border-top-color:var(--accent);background:var(--navy-2)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi.alert b{color:var(--bad)}
.empty{padding:20px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:14px}
.banner{border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.esp{background:color-mix(in srgb,var(--navy) 16%,transparent);color:var(--ink)}
.tier-gold{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.tier-silver{color:var(--silver);background:color-mix(in srgb,var(--silver) 16%,transparent)}
.tier-bronze{color:var(--bronze);background:color-mix(in srgb,var(--bronze) 15%,transparent)}
.watermark{position:fixed;right:-60px;bottom:40px;width:340px;opacity:.05;pointer-events:none;z-index:0}
.wrap>*{position:relative;z-index:1}

/* level = trail sign square */
.lv{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.95rem}
.lv i{width:14px;height:14px;border-radius:3px;display:inline-block;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.lv-Verde{--c:var(--lv-verde)} .lv-Azul{--c:var(--lv-azul)} .lv-Roja{--c:var(--lv-roja)} .lv-Negra{--c:var(--lv-negra)}

/* date nav */
.datenav{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);gap:10px;align-items:center}
.datenav .arrow{min-height:var(--tap);border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.8rem;font-weight:700;line-height:1}
.datenav .d{font-family:var(--f-display);font-weight:700;font-size:1.6rem;text-align:center;text-transform:capitalize}
.datenav .d small{display:block;font-family:var(--f-body);font-size:.85rem;font-weight:600;color:var(--muted);text-transform:none}
.datebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.datebar .datenav{flex:1;min-width:280px}
.datebar input[type=date]{min-height:var(--tap);border:2px solid var(--line);border-radius:14px;padding:0 10px;background:var(--surface)}

/* class cards (glove) */
.cls{display:grid;gap:12px;padding:16px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.cls.pend{border-color:var(--bad)}
.cls-top{display:flex;gap:14px;align-items:flex-start}
.cls-time{font-family:var(--f-display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1;min-width:76px}
.cls-time span{display:block;font-size:1.05rem;color:var(--muted);font-weight:600;margin-top:4px}
.cls-body{display:grid;gap:6px;min-width:0;flex:1}
.cls-body strong{font-size:1.25rem;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.95rem;color:var(--muted);align-items:center}
.report{font-size:.95rem;background:var(--sunk);border-radius:12px;padding:10px 12px;display:grid;gap:4px}

/* month calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.day{min-height:68px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:6px 4px;display:grid;align-content:space-between;justify-items:center;gap:2px;font-variant-numeric:tabular-nums}
.day .n{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1}
.day .h{white-space:nowrap;font-size:.74rem;font-weight:700;color:var(--muted);line-height:1}
.day .bars{display:flex;gap:2px;height:8px;align-items:flex-end}
.day .bars i{width:6px;border-radius:2px;background:var(--navy)}
.day .bars i.esp{background:var(--accent)}
.day.today{border-color:var(--accent)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.day[aria-pressed="true"] .h{color:var(--on-navy-dim)} .day[aria-pressed="true"] .bars i{background:var(--on-navy)}
.day.off{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px)}
.day.out{visibility:hidden}
.day.pend .n{color:var(--bad)}
.day.has{border-color:color-mix(in srgb,var(--navy) 45%,var(--line))}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted);align-items:center}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

/* availability */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{min-height:72px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;display:grid;place-items:center;line-height:1.1;padding:4px}
.slot small{font-weight:600;font-size:.78rem;color:var(--muted)}
.slot.blocked{background:repeating-linear-gradient(135deg,var(--sunk) 0 7px,var(--surface) 7px 14px);border-color:var(--muted)}
.slot.busy{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:56px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chip.sm{min-height:46px;padding:0 14px;font-size:.92rem}

/* matrix */
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
.mx{min-width:1000px;font-size:.88rem}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:4px;text-align:center;height:64px}
.mx thead th{height:auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding:8px 2px}
.mx th.who{position:sticky;left:0;background:var(--surface);text-align:left;padding:6px 10px;min-width:160px;z-index:1;border-right:1px solid var(--line)}
.mx th.who small{display:block;color:var(--muted);font-weight:600}
.mx-class{width:100%;height:100%;border:0;border-radius:10px;padding:4px 8px;text-align:left;color:#fff;background:var(--c);font-weight:700;overflow:hidden;line-height:1.2}
.mx-class small{display:block;font-weight:500;opacity:.92;font-variant-numeric:tabular-nums}
.mx-class.done{opacity:.6}
.mx-free{width:100%;height:100%;border:2px dashed transparent;background:none;border-radius:10px;color:var(--muted);font-size:1.3rem}
.mx-free:hover,.mx-free:focus-visible{border-color:var(--line);background:var(--sunk)}
.mx-block{display:grid;place-items:center;height:100%;border-radius:10px;font-size:.75rem;color:var(--muted);background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px)}

/* lists & tables */
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;min-height:var(--tap);border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.row .grow{flex:1;min-width:0;display:grid;gap:2px}
.tbl-wrap{overflow-x:auto}
.pins{width:100%;border-collapse:collapse}.pins th,.pins td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}.pins b{font-size:1.15rem;letter-spacing:.15em}
.tbl{min-width:640px;font-size:.95rem}
.tbl th,.tbl td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:800}

/* forms */
.form{display:grid;gap:18px}
.field{display:grid;gap:8px;min-width:0}
.field>span,.legend{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea,.inp{min-height:var(--tap);border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface);width:100%;font-size:1.05rem}
.field textarea{min-height:110px;resize:vertical}
.fields2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.levels{grid-template-columns:repeat(4,1fr)}}
.lvbtn{min-height:92px;border-radius:16px;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;align-content:center;gap:6px;font-weight:800;font-size:1.1rem}
.lvbtn i{width:30px;height:30px;border-radius:5px;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.lvbtn small{font-weight:600;font-size:.8rem;color:var(--muted)}
.lvbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--c)}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:12px;align-items:center;min-height:var(--tap);font-weight:600}
.check input{width:28px;height:28px;accent-color:var(--accent);flex:none}
.err{color:var(--bad);font-weight:700}
.err:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions .btn{flex:1 1 180px}
.step{display:grid;gap:10px}
.step>h3{display:flex;align-items:center;gap:10px}
.step>h3 b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-size:1rem}

/* media */
.media-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.media{border-radius:14px;overflow:hidden;background:var(--sunk);display:grid;gap:8px;padding-bottom:10px;border:1px solid var(--line)}
.media video{width:100%;aspect-ratio:9/12;object-fit:cover;background:#000;display:block;max-width:100%}
.media .cap{padding:0 10px;font-size:.88rem;display:grid;gap:2px}
.media .btns{display:grid;gap:6px;padding:0 10px}
audio{width:100%;max-width:100%}

/* avatars */
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--sunk);color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:1.1rem;border:2px solid var(--line)}
.av.lg{width:76px;height:76px;font-size:1.6rem}
.av.sm{width:38px;height:38px;font-size:.9rem}
.top .av{border-color:color-mix(in srgb,var(--on-navy) 40%,transparent);background:var(--navy-2);color:var(--on-navy)}
.person{display:flex;gap:14px;align-items:center;min-width:0}
.who-cell{display:flex;gap:8px;align-items:center}
.staff-row{display:grid;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px}
.libpick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.libpick button{padding:0;border:3px solid transparent;border-radius:50%;background:none}
.libpick button[aria-pressed="true"]{border-color:var(--accent)}
.libpick img{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block}

/* modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);z-index:20;display:grid;align-items:end;justify-items:center;padding-top:max(20px,env(safe-area-inset-top,0px))}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:20px;overscroll-behavior:contain}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet-h .btn{min-width:var(--tap)}
.msg{white-space:pre-wrap}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* login: one navy look in both themes */
.login{min-height:100%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.login-card{width:100%;max-width:380px;display:grid;gap:20px;text-align:center;position:relative;z-index:1}
.login-logo{width:min(280px,80%);height:auto;margin:0 auto;display:block}
.login h2{color:var(--on-navy)}
.dots{display:flex;justify-content:center;gap:16px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--on-navy-dim)}
.dots i.on{background:var(--on-navy);border-color:var(--on-navy)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{min-height:80px;border-radius:18px;border:2px solid color-mix(in srgb,var(--on-navy) 25%,transparent);background:color-mix(in srgb,var(--on-navy) 10%,transparent);color:var(--on-navy);font-family:var(--f-display);font-size:2.2rem;font-weight:700}
.key:active{background:color-mix(in srgb,var(--on-navy) 25%,transparent)}
.key.fn{font-family:var(--f-body);font-size:1rem;color:var(--on-navy-dim)}
.login .err{color:#FFB3B8}
.login .hint{color:var(--on-navy-dim);font-size:.9rem}
.login .bg-boar{position:absolute;width:560px;max-width:none;opacity:.07;right:-160px;bottom:-60px;pointer-events:none}
.sig{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--on-navy-dim)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}

/* additions for the Airtable version */
.demo-bar{background:var(--warn-bg);color:var(--warn);font-weight:700;text-align:center;padding:8px 16px;font-size:.9rem}
.cls.block{background:repeating-linear-gradient(135deg,var(--sunk) 0 8px,var(--surface) 8px 16px)}
.cls.done{border-color:var(--ok)}
.loading{padding:28px;text-align:center;color:var(--muted);font-weight:600}
.team-day{display:grid;gap:12px}
.team-row{display:grid;gap:8px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.team-row .person b{font-family:var(--f-display);font-size:1.25rem}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:.85rem;font-weight:700;padding:5px 10px;border-radius:10px;background:var(--sunk)}
.mini span.done{background:var(--ok-bg);color:var(--ok)}
.mini span.blk{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);color:var(--muted)}
.wa-note{font-size:.9rem;color:var(--muted)}
.select-who{display:grid;gap:8px;max-width:420px}
.big-kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big-kpi b{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy);border-radius:99px}
.cols{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:150px;padding-top:18px}
.col{display:grid;grid-template-rows:auto 1fr auto;align-items:end;height:100%;text-align:center;gap:4px;min-width:0}
.col .v{font-size:.68rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.col .b{width:100%;background:var(--navy);border-radius:5px 5px 0 0;min-height:2px;align-self:end}
.col.today .b{background:var(--accent)}
.col .d{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;line-height:1.15;font-variant-numeric:tabular-nums}
.col.we .d{color:var(--ink)}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:.95rem}
.hbar .track{height:16px;border-radius:6px;background:var(--sunk);overflow:hidden;position:relative}
.hbar .track i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--navy) 35%,transparent);border-radius:6px}
.hbar .track i.done{background:var(--navy)}
.hbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.split{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.prof{display:grid;gap:12px;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.prof.off{opacity:.6}
.prof-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prof-h b{font-family:var(--f-display);font-size:1.4rem}
.pin-inp{max-width:140px;letter-spacing:.3em;font-variant-numeric:tabular-nums;font-weight:700;text-align:center}
.shared-hello{display:grid;gap:6px}
.msgbox{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.5;overflow-wrap:anywhere}
.msgbox.wa{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.msgbox small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;margin-bottom:4px}
.chan{display:flex;flex-wrap:wrap;gap:6px}
.logrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.logrow:first-child{border-top:0}.logrow small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px}.stepper b{font-family:var(--f-display);font-size:1.9rem;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.chip small{display:block;font-size:.72rem;font-weight:600;line-height:1.1}.chip.busy{opacity:.55}
.chip.tall{min-height:60px;line-height:1.15;padding-top:6px;padding-bottom:6px}
.meet{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.95rem}
.meet svg{width:26px;height:26px;flex:none}.meet-t{display:grid;gap:1px}.meet-t small{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.8}.meet-t b{font-family:var(--f-display);font-size:1.45rem;line-height:1.1}
.meet.warn{background:var(--warn-bg);color:var(--warn)}
.money{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--warn-bg);color:var(--warn)}
.money b{font-family:var(--f-display);font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}.money small{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;display:block;opacity:.85}
.money.ok{background:var(--ok-bg);color:var(--ok)}
.cashbox{display:grid;gap:10px}.cashbox .inp{font-size:1.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.mrow{flex-wrap:wrap}.mrow>.grow{flex:1 1 100%}.mrow>.amt{margin-right:auto}
.row .amt{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.cashgrp{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}.cashgrp:first-of-type{border-top:0;padding-top:0}
.dp{display:grid;grid-template-columns:.8fr 1.5fr 1fr;gap:8px}
.sumline{font-weight:700;background:var(--sunk);border-radius:12px;padding:10px 14px}
.slot{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.slot-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.slot-h b{font-size:1.05rem}
</style></head><body>

const MSG=(()=>{

const APP_URL = "https://ethsanglierskischool.com/staff";

function dayLabel(date) {
  const s = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" })
    .format(new Date(date + "T12:00:00Z"));
  return s.replace(",", "");
}
const first = s => String(s || "").trim().split(/\s+/)[0] || "";
const hoursTxt = h => `${String(Math.round(h * 10) / 10).replace(".", ",")} h`;
const money = x => `${Number.isInteger(x) ? x : x.toFixed(2).replace(".", ",")} €`;
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function classLine(r) {
  const b = r.booking || {};
  return [
    `${r.start}–${r.end}`, b.discipline, b.levelIn ? `pista ${String(b.levelIn).toLowerCase()}` : "",
    b.pax ? plural(+b.pax, "persona", "personas") : "", first(b.client), b.language && b.language !== "Español" ? b.language : "",
    b.meeting && b.meeting !== "Por confirmar" ? `punto: ${b.meeting}` : "",
    b.pending > 0 ? `cobrar en pista ${money(b.pending)}` : "",
  ].filter(Boolean).join(" · ");
}
const waLine = r => { const b = r.booking || {}; return `${r.start}-${r.end} ${[b.discipline, first(b.client)].filter(Boolean).join(" ")}`.trim(); };

function frame(title, intro, lines, name) {
  const rows = lines.map(l => `<tr><td style="padding:10px 14px;border-top:1px solid #E3E7F0;font-size:16px;line-height:1.4">${esc(l)}</td></tr>`).join("");
  return `<!doctype html><html lang="es"><body style="margin:0;background:#F3F5FA;font-family:Arial,Helvetica,sans-serif;color:#1B2440">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:16px">
<table role="presentation" width="100%" style="max-width:560px;background:#fff;border-radius:12px;overflow:hidden" cellpadding="0" cellspacing="0">
<tr><td style="background:#27396D;color:#fff;padding:16px 18px;font-size:18px;font-weight:bold">Eth Sànglier · ${esc(title)}</td></tr>
<tr><td style="padding:18px 18px 8px;font-size:16px">Hola ${esc(name)},<br>${esc(intro)}</td></tr>
<tr><td style="padding:0 18px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0">${rows}</table></td></tr>
<tr><td style="padding:18px"><a href="${APP_URL}" style="display:inline-block;background:#27396D;color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:bold">Abrir la app</a></td></tr>
</table></td></tr></table></body></html>`;
}

/** One teacher's notice. kind = "night" (classes of tomorrow) | "morning" (classes of today). */
function digestFor({ name, rows, date, kind }) {
  const cls = rows.filter(r => !r.block && r.teacher === name && r.date === date).sort((a, b) => a.start.localeCompare(b.start));
  if (!cls.length) return { count: 0, hours: 0 };
  const hours = cls.reduce((a, r) => a + (r.hours || 0), 0), n = cls.length, day = dayLabel(date);
  const when = kind === "night" ? "mañana" : "hoy";
  const lines = cls.map(classLine);
  const subject = `${kind === "night" ? "Mañana" : "Hoy"}: ${plural(n, "clase", "clases")} (${hoursTxt(hours)}) · empiezas a las ${cls[0].start}`;
  const intro = `${when === "mañana" ? "Mañana" : "Hoy"}, ${day}, tienes ${plural(n, "clase", "clases")}:`;
  return {
    count: n, hours, subject, when, day,
    text: `Hola ${name},\n\n${intro}\n\n${lines.map(l => "• " + l).join("\n")}\n\nDetalle y cierre de clases: ${APP_URL}\n\nEth Sànglier`,
    html: frame(`${when === "mañana" ? "Mañana" : "Hoy"} · ${plural(n, "clase", "clases")}`, intro, lines, name),
    waDay: `${when} ${day}`, waSummary: cls.map(waLine).join(" | "),
  };
}

/** The list of the shared profiles (Sanglier, Jabata) for whoever assigns them (Laia). */
function rosterFor({ shared, rows, date, kind }) {
  const per = shared.map(name => ({ name, cls: rows.filter(r => !r.block && r.teacher === name && r.date === date).sort((a, b) => a.start.localeCompare(b.start)) }))
    .filter(p => p.cls.length);
  if (!per.length) return { count: 0 };
  const n = per.reduce((a, p) => a + p.cls.length, 0), day = dayLabel(date), when = kind === "night" ? "mañana" : "hoy";
  const lines = per.flatMap(p => p.cls.map(r => `${p.name} · ${classLine(r)}`));
  const intro = `Reparto de ${when} (${day}) para ${shared.join(" y ")}:`;
  return {
    count: n, subject: `Reparto de ${when}: ${plural(n, "clase", "clases")} para ${per.map(p => p.name).join(" y ")}`, when, day,
    text: (name) => `Hola ${name},\n\n${intro}\n\n${lines.map(l => "• " + l).join("\n")}\n\nEth Sànglier`,
    html: (name) => frame(`Reparto de ${when}`, intro, lines, name),
    waDay: `${when} ${day} (reparto ${shared.join(" y ")})`,
    waSummary: per.map(p => `${p.name}: ${p.cls.map(waLine).join(", ")}`).join(" | "),
  };
}

/** Normalises a phone number to digits with country code (Spanish numbers get 34). null if it can't be right. */
function waNumber(p) {
  let d = String(p || "").replace(/[^\d+]/g, "");
  if (d.startsWith("00")) d = "+" + d.slice(2);
  d = d.replace(/\D/g, "");
  if (d.length === 9 && /^[67]/.test(d)) d = "34" + d;
  return d.length >= 11 && d.length <= 15 ? d : null;
}
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || "").trim());

return {digestFor,rosterFor,waNumber,validEmail};
})();

const DISC = { ski: { es: "esquí", en: "ski", fr: "ski", ca: "esquí" }, snow: { es: "snowboard", en: "snowboard", fr: "snowboard", ca: "snowboard" }, free: { es: "freeride", en: "freeride", fr: "freeride", ca: "freeride" } };
const MOD = { priv: { es: "privada", en: "private", fr: "privé", ca: "privada" }, grp: { es: "en grupo", en: "group", fr: "en groupe", ca: "en grup" }, kid: { es: "para niños", en: "kids", fr: "enfants", ca: "per a nens" } };
function discName(raw, lang) {
  const t = String(raw || "").toLowerCase();
  const base = /snow/.test(t) ? "snow" : /free|fuera/.test(t) ? "free" : /esqu|ski/.test(t) ? "ski" : "";
  if (!base) return String(raw || "").trim() || DISC.ski[lang];
  const mod = /priv/.test(t) ? "priv" : /grup|group/.test(t) ? "grp" : /ni[ñn]|kid|infan|enfant|nen/.test(t) ? "kid" : "";
  if (!mod) return DISC[base][lang];
  return lang === "en" ? `${MOD[mod][lang]} ${DISC[base][lang]}` : `${DISC[base][lang]} ${MOD[mod][lang]}`;
}

/**
 * One reminder, ready to send.
 * x = { kind, lang, name, date, start, end, teacher, disc, pax, meeting, gear, ref, resId, confirmed }

  const notesFor = p => (links.notes ? links.notes(p, x.lang) : []).filter(Boolean);

    [C.row.who, x.teacher || ""], [C.row.where, place || C.tbc], ...((x.kind === "c2h" || x.kind === "c1") && links.helpWa ? [[C.laiaRow, "+" + links.helpWa]] : [])].filter(r => r[1]);
  const text = [C.hi(name), "", m.intro, "", ...rows.map(r => `${r[0]}: ${r[1]}`), ...(mapUrl ? ["", `${C.btn.map}: ${mapUrl}`] : []), "",
    ...m.tips.map(t => "• " + t), ...(m.ask ? ["", m.ask] : []),
    ...(helpLink ? ["", `${H.label}: ${helpLink}`] : []), "", C.sign].join("\n");
  const btn = (href, label, bg) => `<a href="${esc(href)}" style="display:inline-block;background:${bg};color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:bold;margin:0 8px 8px 0">${esc(label)}</a>`;
  const html = `<!doctype html><html lang="${lang}"><body style="margin:0;background:#F3F5FA;font-family:Arial,Helvetica,sans-serif;color:#1B2440">

<tr><td style="padding:6px 18px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #E3E7F0;border-radius:8px">${rows.map(r => `<tr><td style="padding:9px 12px;border-top:1px solid #E3E7F0;font-size:14px;color:#5A6482;width:38%">${esc(r[0])}</td><td style="padding:9px 12px;border-top:1px solid #E3E7F0;font-size:16px;font-weight:bold">${esc(r[1])}</td></tr>`).join("")}</table></td></tr>
<tr><td style="padding:12px 18px 0">${mapUrl ? btn(mapUrl, C.btn.map, "#27396D") : ""}${helpLink ? btn(helpLink, H.label, "#B3202B") : ""}</td></tr>

${m.ask ? `<tr><td style="padding:14px 18px 0;font-size:16px;font-weight:bold;line-height:1.5">${esc(m.ask)}</td></tr>` : ""}
<tr><td style="padding:12px 18px 0;font-size:14px"></td></tr>
<tr><td style="padding:16px 18px 20px;font-size:15px;color:#5A6482">${esc(C.sign)}</td></tr>
</table></td></tr></table></body></html>`;
  // WhatsApp template parameters: {{1}} name  {{2}} "day, start"  {{3}} meeting point  {{4}} map link (no line breaks allowed)
  return { subject: m.subject, text, html, mapUrl, helpLink, lang,
    wa: [name || "👋", `${day} ${x.start}`, place || C.tbc, (x.kind === "c7" ? helpLink || mapUrl : mapUrl || helpLink) || "https://ethsanglierskischool.com"] };
}

      if(body.cash===undefined||body.cash===null||body.cash==='')throw new Error('Dinos si has cobrado algo en efectivo.');
      const amount=Math.round(Number(String(body.cash).replace(',','.'))*100)/100;
      if(!Number.isFinite(amount)||amount<0||amount>3000)throw new Error('El importe tiene que estar entre 0 y 3000 €.');
      const pend=r.booking?.pending;
      if(amount>0&&pend!=null&&amount>pend+0.004)throw new Error(`Has anotado ${eur(amount)} pero a esta reserva solo le quedan ${eur(pend)} por cobrar. Revisa el importe.`);
      if(+body.extraMin>0){this.call('classes/'+id+'/extend','POST',{minutes:+body.extraMin})}
      Object.assign(r,{done:true,level:body.level,summary:body.summary,closedBy:body.by||me.name,cash:amount});
      if(amount>0){this.cashLog.push({teacher:r.teacher,client:r.booking.client,date:r.date,amount,handed:false});
        if(pend!=null)this.rows.forEach(x=>{if(x.booking&&x.booking.resId===r.booking.resId)x.booking.pending=Math.max(0,Math.round((pend-amount)*100)/100)})}
      return {ok:true};}
    throw new Error('Ruta no encontrada.');
  }
};

const PUSH={state:'checking',busy:false,msg:''};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const b64uToU8=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushReg(){return navigator.serviceWorker.register('sw.js',{scope:'./'})}
async function pushCheck(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){PUSH.state=isIOS&&!standalone()?'ios-install':'unsupported';return render()}
  if(Notification.permission==='denied'){PUSH.state='denied';return render()}
  try{const reg=await pushReg();const sub=await reg.pushManager.getSubscription();PUSH.state=sub&&Notification.permission==='granted'?'on':'off'}catch(e){PUSH.state='off'}
  render();
}
async function pushOn(){
  const perm=await Notification.requestPermission();          /* first, while the tap still counts (iPhone needs that) */
  if(perm!=='granted'){PUSH.state=perm==='denied'?'denied':'off';throw new Error('Sin permiso para notificaciones.')}
  const {key}=await api('push/key');
  if(!key)throw new Error('Las notificaciones aún no están configuradas. Avisa a Laia.');
  const reg=await pushReg();await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub){const cur=sub.options&&sub.options.applicationServerKey;if(cur&&btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')!==key){await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)});
  await api('push/subscribe',{method:'POST',body:{subscription:sub.toJSON()}});
  PUSH.state='on';
}
async function pushOff(quiet){
  try{const reg=await navigator.serviceWorker.getRegistration('./');const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){const ep=sub.endpoint;await sub.unsubscribe();if(U.token&&!U.demo)await api('push/unsubscribe',{method:'POST',body:{endpoint:ep}}).catch(()=>{})}}
  catch(e){if(!quiet)throw e}
  PUSH.state='off';
}
function pushSheet(){
  const S=PUSH.state,b=PUSH.busy;
  const body={
    on:`<p>Las notificaciones están <b>activadas</b> en este móvil. Te llegará el aviso de tus clases la noche antes y por la mañana.</p>
      <button class="btn huge primary" data-act="pushTest" ${b?'disabled':''}>Enviar una prueba</button>
      <button class="btn block ghost danger" data-act="pushOff" ${b?'disabled':''}>Desactivar en este móvil</button>`,

      <button class="btn huge primary" data-act="pushOn" ${b?'disabled':''}>${b?'Activando…':'Activar notificaciones'}</button>`,
    'ios-install':`<p>En iPhone las notificaciones solo funcionan con la app en la pantalla de inicio:</p>
      <ol><li>Toca <b>Compartir</b> (el cuadrado con la flecha) en Safari.</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Abre la app desde el icono nuevo y vuelve a tocar 🔕.</li></ol>`,
    denied:`<p>Este navegador tiene <b>bloqueadas</b> las notificaciones de esta web. Actívalas en los ajustes del navegador (Notificaciones) y vuelve a intentarlo.</p>`,
    unsupported:`<p>Este navegador no permite notificaciones. Prueba con Chrome en Android, o en iPhone añade la app a la pantalla de inicio.</p>`,
    checking:`<p>Comprobando…</p>`,
  }[S]||'';
  return sheet('Notificaciones',`<div class="form">${body}${PUSH.msg?`<p class="small muted">${esc(PUSH.msg)}</p>`:''}
    <button class="btn block ghost" data-act="closeSheet">Cerrar</button></div>`,'Solo en este móvil');
}

/* ================= API ================= */
async function api(path,{method='GET',body}={}){
  if(U.demo) return DEMO.call(path,method,body);
  let r;
  try{ r=await fetch('/api/staff/'+path,{method,headers:{'content-type':'application/json',...(U.token?{authorization:'Bearer '+U.token}:{})},body:body?JSON.stringify(body):undefined}); }
  catch(e){ if(path==='login'&&CAN_DEMO){U.demo=true;return DEMO.call(path,method,body);} throw new Error('Sin conexión. Revisa la cobertura y vuelve a intentarlo.'); }
  let d; try{d=await r.json()}catch(e){ if(path==='login'&&CAN_DEMO){U.demo=true;return DEMO.call(path,method,body);} throw new Error('El servidor no responde. Prueba en un minuto.'); }
  if(r.status===401&&path!=='login'){logout(d.error);throw new Error(d.error);}
  if(!r.ok) throw new Error(d.error||'Error inesperado.');
  return d;
}
function invalidate(){U.cache={};U.pending={};U.dash=null}
function need(who,from,to){
  const key=who+'|'+from+'|'+to;
  if(U.cache[key]) return U.cache[key];
  if(!U.pending[key]){
    U.pending[key]=true;
    const qs=`from=${from}&to=${to}`+(who&&who!==U.me.name?`&who=${encodeURIComponent(who)}`:'');
    api('schedule?'+qs).then(d=>{U.cache[key]=d.items;delete U.pending[key];render()})
      .catch(e=>{delete U.pending[key];U.err=e.message;toast(e.message)});
  }
  return null;
}
function needTeam(){
  if(U.team) return U.team;
  if(!U.pending.team){U.pending.team=true;api('team').then(d=>{U.team=d.team;render()}).catch(e=>toast(e.message))}
  return null;
}

    return `<button class="slot ${whole?'blocked':''}" data-act="blockHour" data-t="${h}" ${whole?'disabled':''}>${h}<small>${whole?'Día libre':'Disponible'}</small></button>`;
  }).join('');
  return `${dateNav()}
  <section class="card"><h2>Mi disponibilidad</h2>
    <p class="muted">Marca las horas o los días que no trabajas para la escuela. La web deja de ofrecerte en esas horas.</p>

    <div class="slots">${slots}</div></section>`;
}

/* ---------------- create a class · add days ---------------- */
const YEARS=[2026,2027,2028,2029,2030];
const dpDays=(y,m)=>new Date(y,m,0).getDate();
function datePick(id,val){
  const [y,m,d]=val.split('-').map(Number),[ty,tm,td]=today().split('-').map(Number);
  return `<div class="dp" id="${id}">
    <select class="inp" id="${id}-d" aria-label="Día">${Array.from({length:dpDays(y,m)},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===d?'selected':''} ${y===ty&&m===tm&&n<td?'disabled':''}>${n}</option>`).join('')}</select>
    <select class="inp" id="${id}-m" aria-label="Mes">${MONTHS.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''} ${y===ty&&i+1<tm?'disabled':''}>${n[0].toUpperCase()+n.slice(1)}</option>`).join('')}</select>
    <select class="inp" id="${id}-y" aria-label="Año">${YEARS.map(Y=>`<option ${Y===y?'selected':''} ${Y<ty?'disabled':''}>${Y}</option>`).join('')}</select></div>`;
}
function readDP(id){
  const d=$(id+'-d'),m=$(id+'-m'),y=$(id+'-y');if(!d||!m||!y)return null;
  const Y=+y.value,M=+m.value,D=Math.min(+d.value,dpDays(Y,M));let v=Y+'-'+pad(M)+'-'+pad(D);if(v<today())v=today();return v;
}
/* one row per day, each with its own start and hours (like the website booking) */
function slotEditor(p,S){
  const total=S.reduce((a,x)=>a+x.hours,0);
  return S.map((x,i)=>`<div class="slot"><div class="slot-h"><b>Día ${i+1}</b>${S.length>1?`<button type="button" class="btn sm ghost danger" data-act="slotDel" data-p="${p}" data-i="${i}">Quitar</button>`:''}</div>
      ${datePick(`${p}-d${i}`,x.date)}
      <div class="fields2"><label class="field"><span>Empieza a las</span><select class="inp" id="${p}-st${i}">${[...new Set([...STARTS,x.start])].sort().map(t=>`<option ${t===x.start?'selected':''}>${t}</option>`).join('')}</select></label>
        <label class="field"><span>Horas</span><select class="inp" id="${p}-h${i}">${[...new Set([...DURS,x.hours])].sort((a,b)=>a-b).map(h=>`<option value="${h}" ${h===x.hours?'selected':''}>${hTxt(h)}</option>`).join('')}</select></label></div>
      <p class="small muted">${esc(fmtDate(x.date,{weekday:'long',day:'numeric',month:'long'}))} · ${esc(x.start)}–${esc(hmAdd(x.start,Math.round(x.hours*60)))}</p></div>`).join('')
    +(S.length<14?`<button type="button" class="btn block" data-act="slotAdd" data-p="${p}">+ Añadir otro día</button>`:'')
    +`<p class="sumline">${S.length} ${S.length===1?'día':'días'} · ${hTxt(total)} en total</p>`;
}
function readSlots(p,S){S.forEach((x,i)=>{const d=readDP(`${p}-d${i}`),t=$(`${p}-st${i}`),h=$(`${p}-h${i}`);if(d)x.date=d;if(t)x.start=t.value;if(h)x.hours=+h.value})}
const slotsOf=p=>p==='nc'?U.nc.slots:U.md.slots;
const slotDup=S=>{const seen=new Set();for(const x of S){if(seen.has(x.date))return x.date;seen.add(x.date)}return ''};

function loadBusy(date){
  U.ncBusy=U.ncBusy||{};
  if(U.ncBusy[date]||U.pending['busy'+date])return;
  U.pending['busy'+date]=true;
  api(`schedule?from=${date}&to=${date}&who=all`).then(d=>{U.ncBusy[date]=d.items;delete U.pending['busy'+date];render()}).catch(()=>{delete U.pending['busy'+date]});
}
function readNC(){
  const N=U.nc;if(!N)return;
  [['name','nc-name'],['phone','nc-phone'],['email','nc-email'],['notes','nc-notes'],['price','nc-price'],['paid','nc-paid']].forEach(([k,id])=>{const e=$(id);if(e)N[k]=e.value.trim()});
  readSlots('nc',N.slots);N.date=N.slots[0].date;N.start=N.slots[0].start;N.hours=N.slots[0].hours;
}
function newClassSheet(){
  const N=U.nc,adm=isAdmin(),team=adm?needTeam():null;N.date=N.slots[0].date;N.start=N.slots[0].start;N.hours=N.slots[0].hours;const end=hmAdd(N.start,Math.round(N.hours*60));
  const chip=(act,v,on,label,extra='')=>`<button type="button" class="chip ${extra}" data-act="${act}" data-v="${esc(v)}" aria-pressed="${on}">${label??esc(v)}</button>`;
  const busyOf=name=>{const items=(U.ncBusy||{})[N.date];if(!items)return null;
    const c=items.find(c=>c.teacher===name&&(c.wholeDay||(toMin(c.start)<toMin(end)&&toMin(c.end)>toMin(N.start))));return c?(c.wholeDay?'día bloqueado':`${c.start}–${c.end}`):''};
  const tl=adm&&team?team.filter(p=>p.role!==ADMIN||(p.disciplines||[]).length).sort((a,b)=>{const m=p=>(p.disciplines||[]).includes(DISC_PROF[N.discipline])?0:p.role===OCC?2:1;return m(a)-m(b)||a.name.localeCompare(b.name)}):[];
  return sheet(adm?'Nueva clase':'Crear clase',`<div class="form">
    <div class="step"><h3><b>1</b>Cliente</h3>
      <label class="field"><span>Nombre</span><input class="inp" id="nc-name" value="${esc(N.name)}" autocomplete="off"></label>
      <div class="fields2"><label class="field"><span>WhatsApp / teléfono</span><input class="inp" id="nc-phone" type="tel" inputmode="tel" value="${esc(N.phone)}" placeholder="+34 600 123 456" autocomplete="off"></label>
        <label class="field"><span>Email (opcional)</span><input class="inp" id="nc-email" type="email" inputmode="email" value="${esc(N.email)}" autocomplete="off"></label></div></div>
    <div class="step"><h3><b>2</b>Qué clase</h3>
      <div class="chips">${CLS_DISC.map(x=>chip('ncDisc',x,N.discipline===x)).join('')}</div>
      <div class="levels">${LEVELS.map(l=>`<button type="button" class="lvbtn lv-${l}" data-act="ncLevel" data-v="${l}" aria-pressed="${N.level===l}"><i></i>${l}<small>${LEVEL_DESC[l]}</small></button>`).join('')}</div>
      <div class="field"><span>Personas</span><div class="stepper"><button type="button" class="btn" data-act="ncPax" data-n="-1" aria-label="Menos">−</button><b>${N.pax}</b><button type="button" class="btn" data-act="ncPax" data-n="1" aria-label="Más">+</button></div></div>
      <div class="field"><span>Idioma</span><div class="chips">${LANGS.map(x=>chip('ncLang',x,N.language===x,null,'sm')).join('')}</div></div></div>
    <div class="step"><h3><b>3</b>Cuándo</h3>
      <p class="small muted">Cada día puede empezar a una hora distinta y durar distinto.</p>
      ${slotEditor('nc',N.slots)}</div>
    ${adm?`<div class="step"><h3><b>4</b>Profesor</h3><div class="chips">${tl.map(p=>{const b=busyOf(p.name);
        return `<button type="button" class="chip tall ${b?'busy':''}" data-act="ncTeacher" data-v="${esc(p.name)}" aria-pressed="${N.teacher===p.name}">${esc(p.name)}${b?`<small>ocupado ${esc(b)}</small>`:p.role===OCC?'<small>compartido</small>':''}</button>`}).join('')||'<span class="small muted">Cargando…</span>'}</div>
      <p class="small muted">«Ocupado» se calcula para el primer día. Si hay un choque en otro día, te avisa al crear.</p></div>`:''}
    <div class="step"><h3><b>${adm?5:4}</b>Punto de encuentro</h3><div class="chips">${MEETS.map(x=>chip('ncMeet',x,N.meeting===x,null,'sm')).join('')}</div></div>
    ${adm?`<div class="field"><span>Estado de la reserva</span><div class="chips">${['Confirmada','Faltan datos'].map(x=>chip('ncStatus',x,N.status===x,null,'sm')).join('')}</div></div>`:''}
    ${adm?`<div class="step"><h3>Dinero (opcional)</h3><div class="fields2"><label class="field"><span>Precio total €</span><input class="inp" id="nc-price" type="text" inputmode="decimal" value="${esc(N.price)}" placeholder="180" autocomplete="off"></label>
        <label class="field"><span>Ya pagado €</span><input class="inp" id="nc-paid" type="text" inputmode="decimal" value="${esc(N.paid)}" placeholder="60" autocomplete="off"></label></div>
      <p class="small muted">Con precio, la app muestra lo que queda por cobrar y los profes pueden anotar el efectivo.</p></div>`:''}
    <label class="field"><span>Notas para el equipo (opcional)</span><textarea class="inp" id="nc-notes" rows="2">${esc(N.notes)}</textarea></label>
    <p class="err">${esc(N.err||'')}</p>
    <button class="btn huge primary" data-act="ncCreate" ${N.saving?'disabled':''}>${N.saving?'Creando…':adm?'Crear clase':'Guardar la clase'}</button></div>`,
    adm?'Se guarda en Airtable, en la misma reserva que usa la web.':'Queda como «Faltan datos» para que Laia la confirme y la cobre.');
}
function openMD(id){
  const c=findItem(id);
  const first=addDays(c.date>=today()?c.date:today(),1);
  U.md={id,slots:[{date:first,start:c.start,hours:c.hours||1}],err:''};
  U.modal={type:'moreDays'};render();
}
function moreDaysSheet(){
  const M=U.md,c=findItem(M.id),b=c.booking||{};
  return sheet('Más días con esta reserva',`<div class="form">
    <p class="muted">${esc(b.client||'')} · se añaden a la reserva ${esc(b.ref||'')}, con ${esc(c.teacher)}.</p>
    ${slotEditor('md',M.slots)}
    <p class="err">${esc(M.err||'')}</p>
    <button class="btn huge primary" data-act="mdSave" ${M.saving?'disabled':''}>${M.saving?'Añadiendo…':'Añadir a la reserva'}</button></div>`,
    'Laia verá el cambio en su panel para cobrarlo.');
}

/* ---------------- admin: notices (email + WhatsApp, night before and morning of) ---------------- */
function needNotify(){
  const k=U.nk||'night';U.notify=U.notify||{};
  if(U.notify[k]) return U.notify[k];
  if(!U.pending['n'+k]){U.pending['n'+k]=true;api('notify/preview?kind='+k).then(d=>{U.notify[k]=d;delete U.pending['n'+k];render()}).catch(e=>{delete U.pending['n'+k];toast(e.message)})}
  return null;
}
function needLog(){
  if(U.nlog) return U.nlog;
  if(!U.pending.nlog){U.pending.nlog=true;api('notify/log').then(d=>{U.nlog=d.log;delete U.pending.nlog;render()}).catch(e=>{delete U.pending.nlog;U.nlog=[];render()})}
  return null;
}
function avisosView(){
  const w=U.nw||'team';
  const top=`<div class="card-h"><h1>Avisos</h1></div><div class="chips" role="group" aria-label="A quién">
    <button class="chip" data-act="nw" data-v="team" aria-pressed="${w==='team'}">Profesores</button>
    <button class="chip" data-act="nw" data-v="clients" aria-pressed="${w==='clients'}">Clientes · menos no-shows</button></div>`;
  return top+(w==='clients'?clientsView():teamAvisosView());
}
const CK_TXT={c7:'7 días antes',c1:'noche antes',c2h:'2 h antes'};
const LOG_KIND={night:'noche antes',morning:'mañana',c7:'cliente · 7 días',c1:'cliente · noche antes',c2h:'cliente · 2 h'};
function needClients(){
  const l=U.cl||'es';U.clients=U.clients||{};
  if(U.clients[l]) return U.clients[l];
  if(!U.pending['c'+l]){U.pending['c'+l]=true;api('notify/clients?lang='+l).then(d=>{U.clients[l]=d;delete U.pending['c'+l];render()}).catch(e=>{delete U.pending['c'+l];toast(e.message)})}
  return null;
}
function clientsView(){
  const l=U.cl||'es',ck=U.ck||'c7',d=needClients(),log=needLog();
  if(!d) return '<p class="loading">Cargando los recordatorios…</p>';
  const S=d.setup;
  const status=U.demo?`<div class="banner warn"><strong>Modo demo.</strong> Reservas de ejemplo. Los mensajes son los reales; «Enviar prueba» solo simula el envío.</div>`
    :!(S.on&&S.clients)?`<div class="banner warn"><strong>Los recordatorios a clientes están apagados.</strong> Puedes ver los mensajes y enviarte una prueba, pero no sale nada solo hasta que se active (variable NOTIFY_CLIENTS=1 en Netlify).</div>`
    :`<div class="banner ok"><strong>Recordatorios activados.</strong> ${(S.clientKinds||['c7','c1']).map(k=>k==='c7'?`7 días antes (desde las ${esc(S.clientAt)})`:k==='c1'?`la noche antes (desde las ${esc(S.clientNight||'19:00')})`:'2 horas antes de cada clase').join(' · ')}. Indicaciones de cada punto de encuentro: tabla «Puntos de encuentro» en Airtable${S.dryRun?' · en simulación: no se envía nada':''}.</div>`;
  const ready=`<div class="chan"><span class="pill ${S.emailReady?'ok':'bad'}">Email ${S.emailReady?'listo':'sin configurar'}</span><span class="pill ${S.clientWa?'ok':''}">WhatsApp clientes ${S.clientWa?'listo':'apagado'}</span></div>`;
  const B=d.bookings, paid=B.filter(b=>b.state==='Señal pagada'||b.state==='Confirmada');
  const order=b=>(b.problems.length?0:1);
  const list=[...B].sort((a,b)=>order(a)-order(b)||(a.date+a.start).localeCompare(b.date+b.start)).slice(0,30);
  const stCls=s=>s==='Enviado'||s==='Simulado'?'ok':s==='Error'?'bad':s==='No enviado'?'warn':'';
  const card=b=>{
    const rem=b.reminders.filter(r=>r.kind!=='c2h'||r.date===b.date).map(r=>`<span class="pill ${stCls(r.status)}">${CK_TXT[r.kind]} · ${esc(r.status.toLowerCase())}</span>`).join('');
    return `<article class="prof"><div class="prof-h"><b>${esc(b.name)}</b><span class="pill">${esc(b.lang)}</span>
</div>
      <p>${esc(fmtDate(b.date,{weekday:'short',day:'numeric',month:'short'}))} · <b>${esc(b.start)}</b> · ${esc(b.teacher)} · ${esc(b.discipline)} · ${b.meeting&&!/confirmar/i.test(b.meeting)?esc(b.meeting):'<b>sin punto de encuentro</b>'}</p>
      <div class="chan">${rem}</div>
      ${b.problems.length?`<div class="banner warn"><strong>Ojo:</strong> ${esc(b.problems.join(' · '))}.</div>`:''}
</article>`};
  const sample=(d.samples||[]).find(x=>x.kind===ck)||d.samples[0];
  const preview=`<section class="card"><h2>Así lo recibe el cliente</h2>
    <div class="chips" role="group" aria-label="Idioma">${['es','en','fr','ca'].map(x=>`<button class="chip" data-act="cl" data-v="${x}" aria-pressed="${x===l}">${x.toUpperCase()}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Qué recordatorio">${['c7','c1','c2h'].map(x=>`<button class="chip" data-act="ck" data-v="${x}" aria-pressed="${x===ck}">${CK_TXT[x]}</button>`).join('')}</div>
    <div class="msgbox"><small>Email · ${esc(sample.subject)}</small>${esc(sample.text.replace(/https?:\/\/\S+/g,'🔗 (enlace)'))}</div>
    <p class="small muted">Los enlaces (🔗) van como botones en el email: el mapa y el WhatsApp de Laia.</p>
    <label class="field"><span>Mándate una prueba a este email</span><input class="inp" id="cl-to" type="email" inputmode="email" autocomplete="off" value="${esc(U.cto||'')}" placeholder="tu@correo.com"></label>
    <div class="actions"><button class="btn primary" data-act="clTest" data-c="0">Enviar prueba</button></div></section>`;
  const logRows=log===null?'<p class="loading">Cargando…</p>':log.filter(x=>/^c/.test(x.kind)).slice(0,12).map(x=>`<div class="logrow"><span><b>${esc(x.who)}</b> · ${esc(x.channel)} · ${esc(LOG_KIND[x.kind]||x.kind)}${x.detail&&x.status!=='Enviado'?`<br><small>${esc(x.detail)}</small>`:''}</span><span class="pill ${stCls(x.status)}">${esc(x.status)}</span><small>${esc(new Date(x.at).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</small></div>`).join('')||'<p class="empty">Todavía no se ha enviado ningún recordatorio a clientes.</p>';
  return `<p class="muted">A cada cliente con la reserva pagada: una semana antes (ya lo estamos preparando; Laia les ayuda con el material), dos días antes (todo listo, te esperamos) y dos horas antes (profesor, punto de encuentro, mapa y teléfono de Laia). En su idioma.</p>
    ${status}${ready}
    <p><b>${paid.length}</b> reservas pagadas con clase en los próximos días. Las que tienen algún problema salen arriba.</p>
    <h2>Próximas reservas</h2>
    <div class="split">${list.map(card).join('')||'<p class="empty">No hay reservas con clase en los próximos días.</p>'}</div>
    ${preview}
    <section class="card"><h2>Últimos recordatorios a clientes</h2>${logRows}</section>
    <div class="actions"><button class="btn" data-act="clRefresh">Actualizar</button></div>`;
}
function teamAvisosView(){
  const k=U.nk||'night',d=needNotify(),log=needLog();
  const seg=`<div class="chips" role="group" aria-label="Qué aviso ver">
    <button class="chip" data-act="nk" data-v="night" aria-pressed="${k==='night'}">Noche anterior · clases de mañana</button>
    <button class="chip" data-act="nk" data-v="morning" aria-pressed="${k==='morning'}">Por la mañana · clases de hoy</button></div>`;
  const head='';
  if(!d) return head+seg+'<p class="loading">Preparando los mensajes…</p>';
  const S=d.setup, when=k==='night'?'mañana':'hoy';
  const status=U.demo?`<div class="banner warn"><strong>Modo demo.</strong> Así se verían los avisos. «Enviar prueba» solo simula el envío.</div>`
    :!S.on?`<div class="banner warn"><strong>Los avisos automáticos están apagados.</strong> Puedes ver los mensajes y enviar pruebas, pero no sale nada solo hasta que se active.</div>`
    :`<div class="banner ok"><strong>Avisos automáticos activados.</strong> Salen a las ${esc(S.night)} (clases de mañana) y a las ${esc(S.morning)} (clases de hoy)${S.dryRun?' · en simulación: no se envía nada':''}.</div>`;
  const ready=`<div class="chan"><span class="pill ${S.emailReady?'ok':'bad'}">Email ${S.emailReady?'listo':'sin configurar'}</span><span class="pill ${S.whatsappReady?'ok':'bad'}">WhatsApp ${S.whatsappReady?'listo':'sin configurar'}</span></div>`;
  const cards=d.cards.filter(c=>c.count||c.rosterCount||c.problems.length||c.notify.length).sort((a,b)=>(b.count+b.rosterCount>0)-(a.count+a.rosterCount>0)||a.name.localeCompare(b.name));
  const idle=d.cards.filter(c=>!cards.includes(c));
  const card=c=>{
    const hasMsg=c.message||c.rosterMessage, open=U.nopen===c.id+k;
    const em=c.notify.includes('Email'),wa=c.notify.includes('WhatsApp'),pu=c.notify.includes('Push'),pd=c.pushDevices||0;
    const ch=[`<span class="pill ${em?(MSG.validEmail(c.email)?'ok':'bad'):''}">${em?(MSG.validEmail(c.email)?'Email · '+esc(c.email):'Email · falta'):'Email apagado'}</span>`,
      `<span class="pill ${wa?(MSG.waNumber(c.phone)?'ok':'bad'):''}">${wa?(MSG.waNumber(c.phone)?'WhatsApp · +'+MSG.waNumber(c.phone):'WhatsApp · falta'):'WhatsApp apagado'}</span>`,
      `<span class="pill ${pu?(pd?'ok':'bad'):''}">${pu?(pd?'Móvil · '+pd+(pd===1?' dispositivo':' dispositivos'):'Móvil · sin activar'):'Móvil apagado'}</span>`].join('');
    const lines=[c.count?`${when[0].toUpperCase()+when.slice(1)}: <b>${c.count} ${c.count===1?'clase':'clases'}</b>`:`Sin clases ${when}`,
      c.rosterCount?`Además recibe el reparto de Sanglier y Jabata (${c.rosterCount} ${c.rosterCount===1?'clase':'clases'})`:''].filter(Boolean).join(' · ');
    const msgs=open?`${c.message?`<div class="msgbox"><small>Email · ${esc(c.message.subject)}</small>${esc(c.message.text)}</div>
        <div class="msgbox wa"><small>WhatsApp</small>${esc(WA_TEMPLATE(c.name,c.message.waDay,c.message.waSummary))}</div>`:''}
      ${c.rosterMessage?`<div class="msgbox"><small>Email · ${esc(c.rosterMessage.subject)}</small>${esc(c.rosterMessage.text)}</div>
        <div class="msgbox wa"><small>WhatsApp (reparto)</small>${esc(WA_TEMPLATE(c.name,c.rosterMessage.waDay,c.rosterMessage.waSummary))}</div>`:''}`:'';
    return `<article class="prof"><div class="prof-h">${avatar(c.name,'')}<b>${esc(c.name)}</b>${c.role===ADMIN?'<span class="pill esp">Administración</span>':''}</div>
      <p>${lines}</p><div class="chan">${ch}</div>
      ${c.problems.length&&hasMsg?`<div class="banner warn"><strong>No recibirá todo:</strong> ${esc([...new Set(c.problems)].join(' · '))}. <button class="btn sm" data-act="tab" data-tab="perfiles">Arreglar en Perfiles</button></div>`:''}
      ${msgs}
      <div class="actions">${hasMsg?`<button class="btn" data-act="nOpen" data-id="${c.id}">${open?'Ocultar mensaje':'Ver mensaje'}</button>
        <button class="btn primary" data-act="nTest" data-id="${c.id}" data-c="0">Enviar prueba</button>`:'<span class="small muted">Nada que enviar.</span>'}</div></article>`};
  const logHTML=log===null?'<p class="loading">Cargando…</p>':log.length?log.filter(l=>!/^c/.test(l.kind)).slice(0,15).map(l=>`<div class="logrow"><span><b>${esc(l.who)}</b> · ${esc(l.channel)} · ${esc(LOG_KIND[l.kind]||l.kind)}${l.detail&&l.status!=='Enviado'?`<br><small>${esc(l.detail)}</small>`:''}</span>
      <span class="pill ${l.status==='Enviado'?'ok':l.status==='Error'?'bad':''}">${esc(l.status)}</span><small>${esc(new Date(l.at).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}${l.detail==='Prueba'||/^Prueba/.test(l.detail||'')?' · prueba':''}</small></div>`).join(''):'<p class="empty">Todavía no se ha enviado ningún aviso.</p>';
  return head+`<p class="muted">Cada profe recibe su día por email y WhatsApp: la noche anterior y de nuevo por la mañana. Sin nombres completos ni teléfonos de clientes. Si no hay clases, no se envía nada.</p>
    ${status}${ready}${seg}
    <h2>${k==='night'?'Esta noche se enviará':'Mañana por la mañana se enviará'} · ${esc(fmtDate(d.date,{weekday:'long',day:'numeric',month:'long'}))}</h2>
    <div class="split">${cards.map(card).join('')||'<p class="empty">Nadie tiene clases ese día.</p>'}</div>
    ${idle.length?`<p class="small muted">Sin avisos ni clases: ${esc(idle.map(c=>c.name).join(', '))}.</p>`:''}
    <section class="card"><h2>Últimos avisos</h2>${logHTML}</section>
    <div class="actions"><button class="btn" data-act="nRefresh">Actualizar</button></div>`;
}

/* ---------------- sheets ---------------- */
const sheet=(title,body,sub='')=>`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
  <div class="sheet-h"><div><h2>${esc(title)}</h2>${sub?`<p class="muted">${sub}</p>`:''}</div><button class="btn sm" data-act="closeSheet" aria-label="Cerrar">✕</button></div>${body}</div></div>`;
const HAS_SR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
function findItem(id){for(const k in U.cache){const x=U.cache[k].find(c=>c.id===id);if(x)return x}return null}

function closeSheet(){
  const R=U.rep,c=findItem(R.id),b=c.booking||{};
  const chips=isSnow(b.discipline)?SB_CHIPS:SKI_CHIPS;
  return sheet('Terminar clase',`
    <div class="step"><h3><b>1</b>Nivel al terminar</h3>
      <div class="levels">${LEVELS.map(l=>`<button type="button" class="lvbtn lv-${l}" data-act="repLevel" data-v="${l}" aria-pressed="${R.level===l}"><i></i>${l}<small>${LEVEL_DESC[l]}</small></button>`).join('')}</div></div>
    <div class="step"><h3><b>2</b>Qué habéis trabajado</h3><div class="chips">${chips.map(x=>`<button type="button" class="chip" data-act="repChip" data-v="${esc(x)}" aria-pressed="${R.chips.includes(x)}">${esc(x)}</button>`).join('')}</div></div>
    <div class="step"><h3><b>3</b>Nota de voz</h3>
      ${HAS_SR&&!R.noMic?`<button type="button" class="btn huge ${U.rec?'rec':'navy'}" data-act="mic">${ICON.mic}${U.rec?'Parar':'Dictar en voz alta'}</button>`
        :'<p class="small muted">Para dictar, toca el campo y usa el micrófono del teclado del móvil.</p>'}
      ${R.micMsg?`<p class="small muted">${esc(R.micMsg)}</p>`:''}
      <textarea class="inp" id="rp-note" rows="3" placeholder="El dictado aparece aquí. También puedes escribir.">${esc(R.note)}</textarea></div>
    ${isShared()?'':`<div class="step"><h3><b>4</b>¿Se ha alargado?</h3><p class="small muted">Si la clase ha durado más de lo reservado, suma ese tiempo.</p>
      <div class="chips">${[[0,'Tal como estaba'],[30,'+30 min'],[60,'+1 h'],[120,'+2 h']].map(([m,l])=>`<button type="button" class="chip" data-act="repExtra" data-v="${m}" aria-pressed="${(R.extra||0)===m}">${l}</button>`).join('')}</div></div>`}
    ${isShared()?`<div class="step"><h3><b>4</b>Tu nombre</h3><input class="inp" id="rp-by" value="${esc(R.by)}" placeholder="Así sabe Laia quién dio la clase" autocomplete="given-name"></div>`:''}
    <div class="step"><h3><b>5</b>¿Has cobrado en efectivo?</h3>
      ${!isShared()&&b.pending>0?`<p class="small muted">A esta reserva le quedan <b>${eur(b.pending)}</b> por pagar.</p>`:'<p class="small muted">Si el cliente te ha pagado algo en mano, anótalo. Se suma a la reserva en Airtable.</p>'}
      <div class="chips"><button type="button" class="chip" data-act="repCash" data-v="no" aria-pressed="${R.cashMode==='no'}">No he cobrado nada</button>
        <button type="button" class="chip" data-act="repCash" data-v="yes" aria-pressed="${R.cashMode==='yes'}">Sí, he cobrado</button></div>
      ${R.cashMode==='yes'?`<div class="cashbox"><input class="inp" id="rp-cash" type="text" inputmode="decimal" placeholder="0 €" value="${esc(R.cash||'')}" autocomplete="off" aria-label="Importe cobrado en euros">
        ${!isShared()&&b.pending>0?`<div class="chips"><button type="button" class="chip sm" data-act="repCashAll" data-v="${b.pending}">Todo (${eur(b.pending)})</button></div>`:''}</div>`:''}</div>

    <button class="btn huge primary" data-act="saveClose" ${R.saving?'disabled':''}>${R.saving?'Guardando…':'Guardar y cerrar clase'}</button>`,
    `${esc(b.client||'')} · ${esc(fmtDate(c.date))} · ${esc(c.start)}–${esc(c.end)}`);
}
function summaryText(c){
  const b=c.booking||{};
  return `Eth Sànglier · clase cerrada\n${fmtDate(c.date,{weekday:'long',day:'numeric',month:'long'})} · ${c.start}–${c.end}\n${b.ref?b.ref+' · ':''}${b.discipline||''}\nAlumno/a: ${b.client||''}\nNivel al terminar: pista ${String(c.level).toLowerCase()}\nTrabajado: ${c.summary}${c.cash>0?`\nEfectivo cobrado: ${eur(c.cash)}`:''}\nProfe: ${c.closedBy}`;
}
function familyText(c){
  const b=c.booking||{};
  return `Hola ${String(b.client||'').split(' ')[0]}, soy ${U.me.name}, de Eth Sànglier.\n\nResumen de la clase de hoy:\n• Nivel al terminar: pista ${String(c.level).toLowerCase()} (${LEVEL_DESC[c.level]||''})\n• Lo trabajado: ${c.summary}\n\nEn la próxima clase seguimos desde aquí.`;
}
const wa=(num,text)=>`https://wa.me/${String(num).replace(/\D/g,'')}?text=${encodeURIComponent(text)}`;
function sentSheet(){
  const c=findItem(U.modal.id), b=c.booking||{}, t=summaryText(c);
  return sheet(U.modal.fresh?'Clase cerrada':'Enviar resumen',`
    ${U.modal.fresh?`<div class="banner ok"><strong>Guardado en Airtable. Ya cuenta en tus horas.</strong><span class="small">${c.cash>0?`Efectivo anotado: ${eur(c.cash)}.`:'Anotado: sin cobro en efectivo.'}</span></div>`:''}
    <textarea class="inp msg" id="msg-text" rows="8" readonly>${esc(t)}</textarea>
    ${U.laiaWa?`<a class="btn huge primary" href="${wa(U.laiaWa,t)}" target="_blank" rel="noopener">Enviar resumen a Laia</a>`
      :'<p class="wa-note">Falta el WhatsApp de Laia en la configuración. Copia el texto y envíaselo.</p>'}
    ${!isShared()&&b.wa?`<a class="btn huge" href="${esc(b.wa)}?text=${encodeURIComponent(familyText(c))}" target="_blank" rel="noopener">Enviar a la familia</a>`:''}
    <button class="btn block" data-act="copyMsg">Copiar texto</button>
    ${isShared()?'':`<div class="step"><h3>Después de la clase</h3><p class="small muted">¿Se ha alargado? Se suma a las horas de esta clase.</p>
      <div class="chips">${[30,60,120].map(m=>`<button type="button" class="chip sm" data-act="extend" data-id="${c.id}" data-min="${m}">+${m===30?'30 min':m/60+' h'}</button>`).join('')}</div>
      <div class="actions"><button class="btn" data-act="moreDays" data-id="${c.id}">Más días con esta reserva</button><button class="btn" data-act="otherClass" data-id="${c.id}">Crear otra clase</button></div></div>`}
    <button class="btn block ghost" data-act="closeSheet">Hecho</button>`);
}
function modalView(){
  if(!U.modal) return '';
  if(U.modal.type==='push') return pushSheet();
  if(U.modal.type==='pinList') return pinListSheet();
  if(U.modal.type==='close') return closeSheet();
  if(U.modal.type==='sent') return sentSheet();
  if(U.modal.type==='newProf') return newProfSheet();
  if(U.modal.type==='newClass') return newClassSheet();
  if(U.modal.type==='moreDays') return moreDaysSheet();
  return '';
}

/* ================= RENDER ================= */
function render(){
  const sh=document.querySelector('.sheet'),st=sh?sh.scrollTop:0;
  let body='';
  if(!U.me) body=loginView();
  else{
    const map={hoy:hoyView,equipo:equipoView,mes:mesView,libre:libreView,panel:panelView,perfiles:perfilesView,avisos:avisosView};
    if(isShared()) body=header()+`<div class="wrap">${sharedView()}</div>`;
    else{const v=(map[U.view]||hoyView)();
      body=header()+(isAdmin()?`<div class="wrap">${v}</div>`:`<div class="wrap has-nav">${v}</div>${bottomNav()}`);}
    body+=`<img class="watermark" src="${A.boarNavy}" alt="">`;
  }
  $('app').innerHTML=body;
  $('modal-root').innerHTML=modalView();
  const ns=document.querySelector('.sheet');if(ns&&sh)ns.scrollTop=st;
  const at=document.querySelector('.tab[aria-current]');if(at&&at.scrollIntoView)try{at.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
let toastT;function toast(t){$('toast-root').innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$('toast-root').innerHTML='',3200)}

/* ================= VOICE ================= */
let REC=null;
function stopRec(){if(REC){try{REC.stop()}catch(e){}}}
function startRec(){
  const R=U.rep,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{
    const r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;
    const base=R.note?R.note.trim()+' ':'';
    r.onresult=e=>{let fin='',int='';for(const x of e.results){x.isFinal?fin+=x[0].transcript:int+=x[0].transcript}
      R.note=(base+fin).trim();const ta=$('rp-note');if(ta)ta.value=(R.note+(int?' '+int:'')).trim()};
    r.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){R.noMic=true;R.micMsg='El micrófono no está permitido aquí. Usa el micrófono del teclado.'}};
    r.onend=()=>{REC=null;U.rec=null;render()};
    r.start();REC=r;U.rec=true;render();
  }catch(e){R.noMic=true;render()}
}

function readNew(){const N=U.modal.form,n=$('np-name'),p=$('np-pin'),e=$('np-email'),f=$('np-phone');if(n)N.name=n.value.trim();if(p)N.pin=p.value.trim();if(e)N.email=e.value.trim();if(f)N.phone=f.value.trim()}
async function tryLogin(){
  const pin=U.pin;U.pin='';U.busy=true;render();
  try{const d=await api('login',{method:'POST',body:{pin}});
    U.token=d.token;U.me=d.me;U.laiaWa=d.laiaWa||'';U.err='';
    if(!U.demo){store.set(TOKEN_KEY,JSON.stringify({token:d.token,me:d.me,laiaWa:U.laiaWa}))}
    U.view=isAdmin()?'panel':'hoy';U.date=today();U.month=today().slice(0,7);U.sel=today();invalidate();
  }catch(e){U.err=e.message}

}

  saveClose:async()=>{
    const R=U.rep;stopRec();

    const summary=[R.chips.join(', '),R.note].filter(Boolean).join('. ');
    if(summary.length<3){R.err='Marca al menos una cosa trabajada o dicta una nota.';return render()}
    if(isShared()&&R.by.length<2){R.err='Escribe tu nombre para que Laia sepa quién dio la clase.';return render()}
    if($('rp-cash'))R.cash=$('rp-cash').value.trim();
    if(!R.cashMode){R.err='Dinos si has cobrado algo en efectivo.';return render()}
    let cash=0;
    if(R.cashMode==='yes'){
      cash=Number(String(R.cash||'').replace(',','.').replace(/\s|€/g,''));
      if(!Number.isFinite(cash)||cash<=0){R.err='Escribe cuánto has cobrado, por ejemplo 60.';return render()}

      if(!isShared()&&pd!=null&&cash>pd+0.004){R.err=`Has anotado ${eur(cash)} pero a esta reserva solo le quedan ${eur(pd)} por cobrar. Revisa el importe.`;return render()}

    R.saving=true;render();
    try{await api('close/'+R.id,{method:'POST',body:{level:R.level,summary,by:R.by,extraMin:R.extra||0,cash}});

    if(!/^\d{4}$/.test(N.pin)){N.err='El PIN tiene que tener 4 cifras.';return render()}
    N.saving=true;render();
    try{await api('profiles',{method:'POST',body:{name:N.name,pin:N.pin,role:N.role,disciplines:N.role===OCC?[]:N.disciplines,email:N.role===OCC?'':N.email,phone:N.role===OCC?'':N.phone,notify:N.role===OCC?[]:N.notify.filter(x=>x!=='Reparto'||N.role===ADMIN)}});
      toast(`${N.name} creado · PIN ${N.pin}`);U.modal=null;U.profiles=null;U.team=null;U.notify=null;invalidate();render()}catch(e){N.saving=false;N.err=e.message;render()}},
  scrim:(d,el,e)=>{if(e.target===el&&!['close','newClass','moreDays'].includes(U.modal?.type)){U.modal=null;render()}},
};
Object.assign(ACT,{
  pushSheet:()=>{PUSH.msg='';U.modal={type:'push'};render();if(PUSH.state==='checking')pushCheck()},
  pushOn:async()=>{PUSH.busy=true;PUSH.msg='';render();try{await pushOn();await api('push/test',{method:'POST',body:{}}).catch(()=>{});toast('Notificaciones activadas')}catch(e){PUSH.msg=e.message}PUSH.busy=false;render()},
  pushOff:async()=>{PUSH.busy=true;render();try{await pushOff();toast('Notificaciones desactivadas en este móvil')}catch(e){PUSH.msg=e.message}PUSH.busy=false;render()},
  pushTest:async()=>{PUSH.busy=true;render();try{await api('push/test',{method:'POST',body:{}});PUSH.msg='Prueba enviada: debería llegar en unos segundos.'}catch(e){PUSH.msg=e.message}PUSH.busy=false;render()},
});
{const out=ACT.logout;ACT.logout=async(...a)=>{await pushOff(true);out(...a)}}   /* a shared phone stops getting the previous person's notices */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='A')return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el,e)}});
document.addEventListener('input',e=>{if(e.target.id==='rp-note'&&U.rep&&!REC)U.rep.note=e.target.value;if(e.target.id==='rp-by'&&U.rep)U.rep.by=e.target.value;if(e.target.id==='rp-cash'&&U.rep)U.rep.cash=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='month-who'){U.monthWho=e.target.value;render()}
  if(/^nc-(d\d+-[dmy]|st\d+|h\d+)$/.test(e.target.id)){readNC();if(isAdmin())loadBusy(U.nc.slots[0].date);render()}
  if(/^md-(d\d+-[dmy]|st\d+|h\d+)$/.test(e.target.id)){readMD();render()}});
document.addEventListener('keydown',e=>{if(!U.me&&/^\d$/.test(e.key))ACT.key({k:e.key});else if(!U.me&&e.key==='Backspace')ACT.key({k:'del'})});

/* restore a saved session (instructors stay signed in for 30 days) */
try{const s=JSON.parse(store.get(TOKEN_KEY)||'null');if(s&&s.token){U.token=s.token;U.me=s.me;U.laiaWa=s.laiaWa||'';U.view=s.me.role===ADMIN?'panel':'hoy'}}catch(e){}
render();
pushCheck();
})();
</script>
